<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <header>
        <h1>Contacto</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Indice</a></li>
            <li><a href="about.html">Sobre Nosotros</a></li>
            <li><a href="galeria.html">Galeria</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>
    <br>


    <main>
        <section>
            <p>Ponte en contacto con nosotros rellenando este formulario.</p>
        </section>
        <section>
            <form action="/procesar-formulario" method="get">
                <fieldset>
                    <legend>Informacion Personal</legend>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" required size="20">
                    <br>
                    <br>
                    <label for="fecha-nacimiento">Fecha de Nacimiento:</label>
                    <input type="date" id="fecha-nacimiento" name="fecha-nacimiento" value="dd/mm/aaaa">
                    <br>
                    <br>
                    <label for="telefono">Telefono:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" required>
                    <br>
                    <br>
                    <label for="direccion">Direccion:</label>
                    <textarea id="direccion" name="direccion"></textarea>
                    <br>
                    <br>
                    <label>Genero:</label>
                    <input type="radio" id="genero" name="genero" value="Hombre" required>
                    <label for="genero">Hombre</label>
                    <input type="radio" id="genero" name="genero" value="Mujer" required>
                    <label for="genero">Mujer</label>
                    <input type="radio" id="genero" name="genero" value="Otro" required>
                    <label for="genero">Otro</label>
                </fieldset>
                <fieldset>
                    <legend>Continente</legend>
                    <label for="continente">Continente:</label>
                    <select id="continente" name="continente" multiple>
                        <option id="America">America</option>
                        <option id="Asia">Asia</option>
                        <option id="Europa">Europa</option>
                        <option id="America">Africa</option>
                        <option id="Oceania">Oceania</option>
                    </select>
                    <br>
                    <br>
                </fieldset>
                <fieldset>
                    <legend>Registro</legend>
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required placeholder="Escribe aqui tu correo">
                    <br>
                    <br>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" minlength="8" required placeholder="********">
                </fieldset>
                <fieldset>
                    <legend>Opciones</legend>
                    <input type="checkbox" id="ofertas" name="ofertas" required>
                    <label for="ofertas">Deseo recibir ofertas y novedades</label>
                    <br>
                    <input type="checkbox" id="terminos" name="ofertas" required>
                    <label for="terminos">Acepto terminos, condiciones y la ley de proteccion de datos</label>
                </fieldset>
                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </form>
        </section>
    </main>
    <br>
    <br>
    <footer>2026 Agencia de Viajes</footer>

</body>

</html>
